<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AdeshLang Documentation</title>
  <!--
    GitHub Pages: /docs/ requests land here because build/docs/ exists
    (it holds the reference pages). The canonical docs home is /docs
    (served from docs.html by GitHub Pages' ".html rule").
  -->
  <meta http-equiv="refresh" content="0;url=/docs" />
  <link rel="canonical" href="/docs" />
  <script>window.location.replace('/docs');</script>
</head>
<body>
  <p>Redirecting to the <a href="/docs">AdeshLang Documentation</a>...</p>
</body>
</html>
